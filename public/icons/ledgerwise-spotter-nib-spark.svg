    <g transform="rotate(-14 24 26)">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M13 21 C13 15.8 18 12 24 12 C30 12 35 15.8 35 21 L24 44.5 Z
           M21.4 22.6 a2.6 2.6 0 1 0 5.2 0 a2.6 2.6 0 1 0 -5.2 0 Z
           M22.9 26.5 L25.1 26.5 L24 39.5 Z"/>
    </g>
    <path d="M36.5 4 C37.3 8.4 38.6 9.7 43 10.5 C38.6 11.3 37.3 12.6 36.5 17
             C35.7 12.6 34.4 11.3 30 10.5 C34.4 9.7 35.7 8.4 36.5 4 Z"/>
