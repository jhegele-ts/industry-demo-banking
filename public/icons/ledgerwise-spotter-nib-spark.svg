  <!--
    LedgerWise — Spotter icon override (rd-icon-spotter), variant.
    The same nib, tilted, with a four-point spark: the near-universal "this is
    AI" signifier. Reads richer at 24px and up; at 16px the spark starts to
    close up, so prefer the plain nib if the icon appears inline in text.
  -->
