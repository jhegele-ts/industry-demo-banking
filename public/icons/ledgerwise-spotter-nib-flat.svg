<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width:0;height:0;visibility:hidden;">
  <defs/>
  <!--
    LedgerWise — Spotter icon override (rd-icon-spotter), flat-shoulder nib.
    Squarer shoulders and slightly concave flanks than the rounded variant, so
    the silhouette reads as a pen nib rather than a map pin once it drops to
    16-20px. Body plus two punched subpaths (breather hole, slit) under
    fill-rule="evenodd"; fill="currentColor" to inherit the surrounding colour.
  -->
  <symbol id="rd-icon-spotter" viewBox="0 0 48 48" fill="currentColor">
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M10 12.5 C14.5 8 33.5 8 38 12.5 C35.5 24 30.5 35 24 44.5 C17.5 35 12.5 24 10 12.5 Z
         M20.8 18.6 a3.2 3.2 0 1 0 6.4 0 a3.2 3.2 0 1 0 -6.4 0 Z
         M22.75 23.4 L25.25 23.4 L24 39 Z"/>
  </symbol>
</svg>
